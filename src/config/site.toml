[config.site]
title = "Martin Toshev"
description = "IT consultant, Java enthusiast, speaker, author, and trainer."
pageTitle = "Martin Toshev | Architecture, Security & the JVM"
pageDescription = "Personal site of Martin Toshev — consulting, conferences, speaking, security, books, trainings, and technical writing."
url = "https://www.martin-toshev.com"
repository = "https://github.com/martinfmi"
footerNote = "Sharing knowledge across the Java ecosystem."

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "blue-soft"
lang = "en"

[config.fonts]
en = "Maple Mono"
code = "Monaco"
zh = "ChillRoundM"
file = "/fonts/ChillRoundM.ttf"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search articles..."
maxResults = 8

[config.pages.blog]
title = "Blog"
kicker = "Notes & reports"
subtitle = "Architecture, security, tools, and community."
note = "Articles migrated from the original martin-toshev.com archive, plus newer notes."
postsPerPage = 8
dateFormat = "yyyy-MM-dd"
metadataSeparator = "icon"
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse topics"
subtitle = ""
note = "Architecture, Security, Tools, Tips and Tricks, and Events."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in order."

[config.pages.projects]
title = "Projects"
kicker = "Open source"
subtitle = "Selected repositories and materials."
note = "Teaching materials, demos, and workshop code."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Short notes."
note = "Quick fragments and updates."
showTrail = true

[config.pages.media]
title = "Media"
subtitle = "Books and related materials."
note = "Published books and references."

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "en"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "en"
dark = "html.dark"
pageview = true
comment = true

